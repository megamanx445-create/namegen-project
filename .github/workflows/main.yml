name: Main Workflow

on:
  push:
    branches:
      - master
  
permissions:
  contents: read
  id-token: write


jobs:
    cicd:
        name: deploy using aws eks cluster
        runs-on: ubuntu-latest

        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Configure temporary AWS credentials
          uses: aws-actions/configure-aws-credentials@v6.1.0
          with:
            aws-region: us-east-2
            role-to-assume: arn:aws:iam::843282289076:role/github-actions-role-namegen
            role-session-name: github-actions-${{ github.run_id }}

        - name: confirm AWS credentials
          run: aws sts get-caller-identity

        - name: login to Amazon ECR
          id: login-ecr
          uses: aws-actions/amazon-ecr-login@v2

        - name: Build, tag, and push image to Amazon ECR
          env:
              ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
              ECR_REPOSITORY: myapps/namegen
              IMAGE_TAG: ${{ github.sha }}
          run: |
            docker build -f docker/dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
            docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

        - name: Configure eks access
          run: |
            aws eks update-kubeconfig --region us-east-2 --name namegen-cluster

        - name: Install kube-prometheus-stack
          run: |
            helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
            helm repo update
            helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
              --namespace monitoring \
              --create-namespace \
              --wait \
              --timeout 10m

        - name: Create MongoDB Kubernetes secret
          env:
            MONGODB_USERNAME: ${{ secrets.MONGODB_USERNAME }}
            MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
          run: |
            kubectl create secret generic mongodb-credentials \
              --from-literal=username="$MONGODB_USERNAME" \
              --from-literal=password="$MONGODB_PASSWORD" \
              --dry-run=client \
              -o yaml | kubectl apply -f -
    
        - name: EKS deployment
          run: |
            kubectl apply -f ./k8s/storage-class.yaml
            kubectl apply -f ./k8s/DB-sts.yaml
            kubectl apply -f ./k8s/deployment.yaml
            kubectl set image deployment/namegen-app namegen=843282289076.dkr.ecr.us-east-2.amazonaws.com/myapps/namegen:${{ github.sha }}
            kubectl rollout status deployment/namegen-app
            kubectl rollout status statefulset/mongo         
            kubectl get services namegen-service